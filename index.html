<style>
/* Layout: un passaporto. Copertina e pagina dati in alto, poi sei tappe sigillate che si aprono con la parola segreta, poi esame finale e diploma. */
:root{
  --bg:#EDF1EE;
  --surface:#FBFCFA;
  --soft:#E1EAE4;
  --ink:#14304B;
  --muted:#51677A;
  --line:#C6D2CA;
  --accent:#2C694C;
  --accent-ink:#FFFFFF;
  --stamp:#B2392D;
  --ok:#2C694C;
  --bad:#B2392D;
  --cover:#17395C;
  --cover-deep:#102B46;
  --foil:#E6CB7E;
  --f-display:"Rozha One",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-sign:"Caveat","Bradley Hand","Segoe Script",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1923;
    --surface:#16232F;
    --soft:#1D2D3B;
    --ink:#E7EEF1;
    --muted:#92A5B3;
    --line:#2B3C4A;
    --accent:#7CC59B;
    --accent-ink:#0B1A12;
    --stamp:#EE7060;
    --ok:#7CC59B;
    --bad:#EE7060;
    --cover:#0F2A45;
    --cover-deep:#0A1E33;
    --foil:#E6CB7E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1923;
  --surface:#16232F;
  --soft:#1D2D3B;
  --ink:#E7EEF1;
  --muted:#92A5B3;
  --line:#2B3C4A;
  --accent:#7CC59B;
  --accent-ink:#0B1A12;
  --stamp:#EE7060;
  --ok:#7CC59B;
  --bad:#EE7060;
  --cover:#0F2A45;
  --cover-deep:#0A1E33;
  --foil:#E6CB7E;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.55;
  overflow:hidden;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.12}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Il libretto: una pila di fogli, ognuno incernierato a sinistra */
.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.deck{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2200px;perspective-origin:50% 35%}
.book{position:relative;width:min(100%,620px);height:100%;max-height:980px}
.book.noanim .leaf,.book.noanim .leaf::after{transition:none!important}

.leaf{
  position:absolute;inset:0;
  transform-origin:left center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px 16px 16px 4px;
  box-shadow:0 10px 26px rgba(0,0,0,.18), inset 12px 0 16px -14px rgba(0,0,0,.4);
  overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .75s cubic-bezier(.4,.1,.2,1), opacity .25s linear .5s, visibility 0s linear .75s;
}
.leaf::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,0));
  opacity:0;transition:opacity .75s;
}
.leaf[data-pos="before"]{transform:rotateY(-115deg);opacity:0;visibility:hidden;pointer-events:none}
.leaf[data-pos="before"]::after{opacity:1}
.leaf[data-pos="current"]{transform:none;opacity:1;visibility:visible;transition-delay:0s,0s,0s}
.leaf[data-pos="next"]{transform:none;opacity:1;visibility:visible;pointer-events:none;transition-delay:0s,0s,0s}
.leaf[data-pos="far"]{transform:none;opacity:0;visibility:hidden;transition:none}

.sheet{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  padding:26px 22px 30px 32px;
  display:flex;flex-direction:column;gap:16px;
}
.sheet > *{flex:none;min-width:0}

/* Copertina */
.leaf.cover{background:var(--cover);color:var(--foil);border-color:var(--cover-deep);box-shadow:0 10px 26px rgba(0,0,0,.28), inset 16px 0 0 var(--cover-deep)}
.leaf.cover::before{content:"";position:absolute;inset:16px 16px 16px 34px;border:1px solid var(--foil);opacity:.5;border-radius:4px;pointer-events:none}
.cover .sheet{align-items:center;justify-content:center;text-align:center;gap:16px;padding:40px 30px 40px 40px;cursor:pointer}
.cover .flower{width:92px;height:92px}
.cover h1{font-size:clamp(36px,9vw,54px);letter-spacing:.04em;text-transform:uppercase}
.cover .langs{opacity:.85}
.cover .dates{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.cover .tap{margin-top:14px}

/* Pagina dati */
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead .kick{color:var(--muted)}
.pagehead h2{font-size:28px}
.idgrid{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:start}
.photo{width:92px;height:116px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:44px;color:var(--accent)}
.fields{display:grid;gap:10px;min-width:0}
.field .mono{color:var(--muted);display:block}
.field div:last-child{font-weight:600}
.mrz{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);overflow-x:auto;white-space:pre;border-top:1px dashed var(--line);padding-top:12px;line-height:1.5}
.sign{font-family:var(--f-sign);font-size:26px;color:var(--ink);line-height:1}

/* Timbri raccolti */
.progress{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:16px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--stamp);background:var(--surface);max-width:76px;width:100%;margin-inline:auto;padding:0;cursor:pointer}
.slot .stamp{width:100%;height:100%}
.progress .mono{color:var(--muted)}

/* Tappe */
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage .kick{color:var(--muted)}
.stage h2{font-size:28px}
.stage[data-state="locked"] h2{color:var(--muted)}
.head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.head > div{min-width:0}
.stamp{width:92px;height:92px;flex:none;color:var(--stamp)}
.stamp text{font-family:var(--f-mono);fill:currentColor;letter-spacing:.12em}
.thump .stamp{animation:thump .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes thump{0%{transform:scale(2.2) rotate(-18deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.lock{width:34px;height:34px;color:var(--muted);flex:none}
.lockwrap{display:flex;justify-content:center;padding-top:20px}
.lockwrap .lock{width:64px;height:64px}
.story{display:flex;flex-direction:column;gap:12px}
.twist{background:var(--soft);border-left:4px solid var(--accent);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-radius:0 6px 6px 0;align-items:flex-start}
.twist .mono{color:var(--accent)}
.fun{border:1px dashed var(--line);padding:14px 16px;border-radius:6px;display:flex;flex-direction:column;gap:6px}
.fun .mono{color:var(--muted)}
.challenge{border:1px solid var(--line);padding:14px 16px;border-radius:6px;display:flex;flex-direction:column;gap:6px}
.challenge .mono{color:var(--muted)}
.src{color:var(--muted);font-size:13px;line-height:1.45}

/* Parola segreta */
.unlock{display:flex;flex-direction:column;gap:10px}
.unlock .row{display:flex;gap:10px;flex-wrap:wrap}
.unlock input{flex:1 1 180px;min-width:0;min-height:52px;padding:10px 14px;background:var(--surface);border:2px solid var(--line);border-radius:6px;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.unlock input:focus{border-color:var(--accent);outline:none}
.btn{min-height:52px;padding:10px 22px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);min-height:44px;padding:8px 16px;font-weight:600}
.btn.foil{background:var(--foil);color:#14304B}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.clipbox{border:1px solid var(--line);padding:14px 16px;border-radius:6px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.clipbox .mono{color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:default}
.msg{min-height:1.4em;font-size:15px;color:var(--bad)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
details.later summary{cursor:pointer;color:var(--muted);font-size:15px;min-height:44px;display:flex;align-items:center}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:10px}
.quiz .q{font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--soft);font-weight:600}
.opt.wrong{border-color:var(--bad)}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.explain{font-size:15px;color:var(--muted)}

/* Esame finale e diploma */
.final h2{font-size:30px}
.final{display:flex;flex-direction:column;gap:20px}
.diploma{background:var(--surface);border-radius:4px;padding:10px;outline:2px solid var(--stamp);outline-offset:-2px;box-shadow:0 0 0 6px var(--surface),0 0 0 7px var(--stamp);margin:8px 6px}
.diploma .inner{border:1px solid var(--stamp);padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.diploma h2{font-size:clamp(34px,9vw,46px);letter-spacing:.05em;text-transform:uppercase}
.diploma .to{font-family:var(--f-display);font-size:clamp(30px,9vw,44px);color:var(--accent);line-height:1}
.diploma .rank{font-family:var(--f-display);font-size:24px}
.diploma .score{color:var(--muted)}
.diploma .sig{font-family:var(--f-sign);font-size:34px;line-height:1}

/* Ultima pagina */
.back ul{margin:0;padding-left:18px;display:grid;gap:6px;overflow-wrap:anywhere;font-size:14px;color:var(--muted)}
.back a{color:var(--accent)}
.back .note{font-size:14px;color:var(--muted)}
.reset{align-self:flex-start}

/* Barra per sfogliare */
.nav{display:flex;align-items:center;gap:12px;width:min(100%,620px);margin-inline:auto}
.nav .btn{min-height:48px;padding:8px 18px;min-width:112px}
.nav .btn.ghost{min-height:48px}
.nav .pg{flex:1;text-align:center;color:var(--muted)}

@media (max-width:420px){
  body{font-size:16px}
  .photo{width:78px;height:100px}
  .stamp{width:76px;height:76px}
  .sheet{padding:22px 16px 26px 26px}
  .nav .btn{min-width:96px;padding-inline:12px}
}
@media (prefers-reduced-motion:reduce){
  .leaf,.leaf::after{transition-duration:.01s!important;transition-delay:0s!important}
  .thump .stamp,.shake{animation:none}
}
</style>

    return '<div class="final"><div><div class="mono" style="color:var(--accent)">Prova finale</div><h2>Esame da Fan interplanetaria</h2></div>' +
      '<p>Sei timbri raccolti. Ultime cinque domande. Si possono leggere ad alta voce mentre si guida: rispondi tu.</p>' +
      FINAL.map(function(f, fi){ return quizHTML(f.id, f, state.fin[f.id], "Esame finale " + (fi + 1) + " di " + FINAL.length); }).join("") +
      (answered ? '<div class="twist"><div class="mono">Esame finito</div><p>Il diploma ti aspetta nella pagina dopo.</p><button class="btn" type="button" data-go="' + DIPLOMA_AT + '">Vai al diploma</button></div>' : '') +
      '</div>';
  }

  function diplomaHTML(){
    var done = allOpen() && FINAL.every(function(f){ return typeof state.fin[f.id] === "number"; });
    if (!done) return lockPage("Diploma", "Non ancora", "Arriva dopo l'esame finale.");
    var sc = score(), total = STAGES.reduce(function(a, s){ return a + s.quizzes.length; }, 0) + FINAL.length;
    var rank = RANKS.filter(function(r){ return sc >= r.min; })[0].name;
    return '<div class="diploma"><div class="inner">' +
      '<div class="mono" style="color:var(--stamp)">Salisburgo &middot; Mondsee &middot; 8 e 9 ottobre 2026</div>' +
      '<h2>Diploma</h2>' +
      '<p>si conferisce a</p>' +
      '<div class="to">Roberta Stroppari</div>' +
      '<div class="rank">' + rank + '</div>' +
      '<p>per aver percorso Salisburgo sulle orme di Maria e del Capitano, dal prato dell\'elicottero fino all\'altare di Mondsee.</p>' +
      '<div class="score mono">' + sc + ' risposte esatte su ' + total + '</div>' +
      '<div class="sig">i Giorgi</div>' +
      '</div></div>';
  }

  function backHTML(){
    var tpl = document.getElementById("srcs");
    return '<div class="back" style="display:flex;flex-direction:column;gap:16px">' +
      '<div class="pagehead"><div class="mono kick">Ultima pagina</div><h2>Da dove vengono queste storie</h2></div>' +
      (tpl ? tpl.innerHTML : "") +
      '<p class="note">I progressi restano salvati su questo dispositivo.</p>' +
      '<button class="btn ghost reset" id="reset" type="button">Azzera il passaporto</button></div>';
  }

  function pageHTML(p){
    if (p.id === "cover") return coverHTML();
    if (p.id === "data") return dataHTML();
    if (p.id === "final") return finalHTML();
    if (p.id === "diploma") return diplomaHTML();
    if (p.id === "back") return backHTML();
    return stagePageHTML(p.stage, STAGES.indexOf(p.stage), nextIndex());
  }

  function label(i){
    var p = PAGES[i];
    if (p.id === "cover") return "Copertina";
    if (p.id === "data") return "Pagina dati";
    if (p.stage) return "Tappa " + p.stage.num + " di " + STAGES.length;
    if (p.id === "final") return "Esame finale";
    if (p.id === "diploma") return "Diploma";
    return "Ultima pagina";
  }

  var book = $("book");
  PAGES.forEach(function(p, i){
    var el = document.createElement("section");
    el.className = "leaf" + (i === 0 ? " cover" : "");
    el.style.zIndex = String(TOTAL - i);
    el.setAttribute("aria-label", label(i));
    var sheet = document.createElement("div");
    sheet.className = "sheet";
    el.appendChild(sheet);
    book.appendChild(el);
    p.el = el;
    p.sheet = sheet;
  });

  function renderAll(){
    PAGES.forEach(function(p){
      var top = p.sheet.scrollTop;
      p.sheet.innerHTML = pageHTML(p);
      p.sheet.scrollTop = top;
    });
    updateNav();
  }

  function setPos(){
    PAGES.forEach(function(p, i){
      var pos = i < cur ? "before" : (i === cur ? "current" : (i === cur + 1 ? "next" : "far"));
      p.el.setAttribute("data-pos", pos);
      if (i === cur) { p.el.removeAttribute("inert"); p.el.removeAttribute("aria-hidden"); }
      else { p.el.setAttribute("inert", ""); p.el.setAttribute("aria-hidden", "true"); }
    });
  }

  function updateNav(){
    $("pg").textContent = label(cur);
    $("prev").disabled = (cur === 0);
    $("next").disabled = (cur === TOTAL - 1);
    $("next").innerHTML = (cur === 0 ? "Apri" : "Avanti") + " &rsaquo;";
  }

  function go(n){
    n = clampPage(n);
    if (n === cur) return;
    cur = n;
    state.page = cur;
    save();
    PAGES[cur].sheet.scrollTop = 0;
    setPos();
    updateNav();
  }

  function jump(n){
    book.classList.add("noanim");
    cur = clampPage(n);
    state.page = cur;
    save();
    setPos();
    updateNav();
    void book.offsetWidth;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ book.classList.remove("noanim"); }); });
  }

  document.addEventListener("submit", function(ev){
    var form = ev.target.closest ? ev.target.closest("form.unlock") : null;
    if (!form) return;
    ev.preventDefault();
    var s = STAGES.filter(function(x){ return x.id === form.getAttribute("data-stage"); })[0];
    if (!s) return;
    var input = form.querySelector("input");
    var msg = form.querySelector(".msg");
    var typed = norm(input.value);
    var good = s.words.some(function(w){ return norm(unrev(w)) === typed; });
    if (typed && good) {
      state.open[s.id] = true;
      save();
      justOpened = s.id;
      renderAll();
      PAGES[cur].sheet.scrollTop = 0;
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    } else {
      msg.textContent = typed ? "Non è la parola giusta. Ascolta bene." : "Scrivi la parola che ti hanno detto.";
      input.classList.remove("shake");
      void input.offsetWidth;
      input.classList.add("shake");
      input.focus();
    }
  });

  document.addEventListener("click", function(ev){
    var tgt = ev.target;
    if (cur === 0 && tgt.closest && tgt.closest(".leaf.cover") && !tgt.closest("button")) { go(1); return; }
    var t = tgt.closest ? tgt.closest("button") : null;
    if (!t) return;
    if (t.id === "prev") { go(cur - 1); return; }
    if (t.id === "next") { go(cur + 1); return; }
    var dest = t.getAttribute("data-go");
    if (dest !== null) { go(parseInt(dest, 10)); return; }
    var key = t.getAttribute("data-quiz");
    if (key) {
      var i = parseInt(t.getAttribute("data-i"), 10);
      if (key.charAt(0) === "f") state.fin[key] = i; else state.quiz[key] = i;
      save();
      justOpened = null;
      renderAll();
      return;
    }
    if (t.id === "reset") {
      if (t.getAttribute("data-armed") === "1") {
        state = { open:{}, quiz:{}, fin:{}, page:0 };
        save();
        justOpened = null;
        renderAll();
        PAGES.forEach(function(p){ p.sheet.scrollTop = 0; });
        jump(0);
      } else {
        t.setAttribute("data-armed", "1");
        t.textContent = "Tocca di nuovo per cancellare tutto";
        setTimeout(function(){
          t.removeAttribute("data-armed");
          t.textContent = "Azzera il passaporto";
        }, 4000);
      }
    }
  });

  /* Sfoglia con un colpo di dito verso sinistra o destra. */
  var tx = null, ty = null;
  book.addEventListener("touchstart", function(ev){
    if (ev.touches.length !== 1) { tx = null; return; }
    tx = ev.touches[0].clientX;
    ty = ev.touches[0].clientY;
  }, { passive:true });
  book.addEventListener("touchend", function(ev){
    if (tx === null) return;
    var t = ev.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    var onScroller = ev.target.closest && ev.target.closest(".mrz, input");
    tx = null;
    if (onScroller) return;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 1.6 * Math.abs(dy)) go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive:true });

  document.addEventListener("keydown", function(ev){
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
    if (ev.key === "ArrowRight") go(cur + 1);
    else if (ev.key === "ArrowLeft") go(cur - 1);
  });

  renderAll();
  jump(cur);
})();
</script>

</body>
</html>
